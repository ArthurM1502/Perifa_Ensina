<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='static_css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
    <title>PerifaEnsina</title>
    
  </head>
  <body>
    <div class="container">
      <div class="perifaensina">
        PerifaEnsina
      </div>
      <h2>Login</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash"> {{ messages[0] }} </div>
        {% endif %} 
      {% endwith %}
      <br>
      <form method="POST">
        <div class="inputs">
          <input type="email" name="email" placeholder="Email" required />
          <br>
          <input type="password" name="senha" placeholder="Senha" required />
          <br>
          <div class="submits">
            <input type="submit" value="Entrar"></input>
          </div>
        </div>  
      </form>
      <p>
        Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
      </p>
    </div>
  </body>
</html>
