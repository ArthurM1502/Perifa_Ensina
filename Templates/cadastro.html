<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='static_css/styles.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sedgwick+Ave+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sedgwick+Ave+Display&display=swap"
      rel="stylesheet"
    />
    <title>PerifaEnsina</title>
  </head>
  <body>
    <div class="container">
      <div class="perifaensina">PerifaEnsina</div>

      <div class="login">
        <form method="POST">
          <h3 id="bemvindo">Bem-vindo ao PerifaEnsina!</h3>

          <h3>Selecione o tipo de conta:</h3>
          <div class="radios">
            <input
              type="radio"
              id="professor"
              name="tipo_conta"
              value="professor"
              required
            />
            <label for="professor" class="opcoes">Professor</label>
            <input type="radio" id="aluno" name="tipo_conta" value="aluno" />
            <label for="aluno" class="opcoes">Aluno</label><br />
          </div>

          <h3>Insira as informações a seguir:</h3>
          <div class="inputs">
            <label>Nome:</label>
            <input
              type="text"
              name="nome"
              placeholder="Digite seu Nome"
              required
            /><br />

            <label>Email:</label>
            <input
              type="email"
              name="email"
              placeholder="Digite seu email"
              required
            /><br />

            <label>Senha:</label>
            <input
              type="password"
              name="senha"
              placeholder="Digite sua senha"
              required
            /><br />

            {% with messages = get_flashed_messages() %} {% if messages %}
            <div class="flash" style="margin-bottom: 10px">
              {{ messages[0] }}
            </div>
            {% endif %} {% endwith %}

            <div class="submits">
              <input
                type="submit"
                value="Fazer Cadastro"
                style="font-family: montserrat"
              />
            </div>
            <div class="submits" style="justify-content: center; margin-top: 0">
              <a
                href="{{ url_for('login') }}"
                style="
                  font-family: montserrat;
                  color: #d84b52;
                  text-decoration: underline;
                  font-weight: bold;
                "
                >Voltar ao Login</a
              >
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
